symbols:
  - BTCUSDT
  - ETHUSDT
  - SOLUSDT
  - ADAUSDT
  - DOTUSDT
  - AVAXUSDT
  - MATICUSDT
  - LINKUSDT
  - UNIUSDT
  - ATOMUSDT

data_dir: "data_integrated"
results_dir: "results"

realistic_fee_rate: 0.0002
slippage_rate: 0.0003
cooling_period: 2
hysteresis_threshold: 0.08
ar_stop_threshold: 0.8

model_config:
  d_model: 64
  n_layers: 4
  seq_len: 30
  dropout: 0.1
  train_epochs: 100
  learning_rate: 0.001
  lambda_mdd: 0.1
  lambda_smooth: 0.05
  lambda_regime: 0.2
  batch_size: 64
  patience: 15
  val_split: 0.15
  verbose: false

train_every_n_days: 7
rolling_window_days: 252