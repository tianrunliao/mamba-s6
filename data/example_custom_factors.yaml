# Example Custom Factor Configuration
# This file demonstrates various types of factor definitions you can use

factors:
  # Simple expression factors (single line)
  - name: "price_momentum_5d"
    calculation: "close.iloc[-1] / close.iloc[0] - 1 if len(close) >= 5 else 0"
    direction: 1
    description: "5-day price momentum"

  - name: "volume_correlation"
    calculation: "close.corr(volume) if len(close) > 1 else 0"
    direction: 1
    description: "Price-volume correlation"

  # Multi-line code factors (complex logic)
  - name: "rsi_oscillator"
    calculation: |
      if len(ret) < 14:
          result = 0.5
      else:
          gains = ret[ret > 0].tail(14).sum()
          losses = abs(ret[ret < 0].tail(14).sum())
          if losses == 0:
              result = 1.0
          elif gains == 0:
              result = 0.0
          else:
              rs = gains / losses
              result = rs / (1 + rs)
    direction: 1
    description: "14-day RSI oscillator"

  - name: "smart_money_flow"
    calculation: |
      if len(group) < 20:
          result = 1.0
      else:
          # Identify large trades (top 20% by volume)
          volume_threshold = volume.quantile(0.8)
          large_trades = group[volume > volume_threshold]
          
          if len(large_trades) == 0:
              result = 1.0
          else:
              # Calculate VWAP for large trades vs all trades
              large_vwap = (large_trades['amount'].sum() / 
                           large_trades['volume'].sum()) if large_trades['volume'].sum() > 0 else group['close'].iloc[-1]
              all_vwap = (group['amount'].sum() / 
                         group['volume'].sum()) if group['volume'].sum() > 0 else group['close'].iloc[-1]
              
              result = large_vwap / all_vwap if all_vwap > 0 else 1.0
    direction: 1
    description: "Smart money flow indicator"

  # Statistical factors
  - name: "return_skewness"
    calculation: "scipy.stats.skew(ret) if len(ret) > 3 else 0"
    direction: -1
    description: "Return distribution skewness"

  - name: "volatility_regime"
    calculation: |
      if len(ret) < 10:
          result = 0
      else:
          recent_vol = ret.tail(5).std()
          historical_vol = ret.head(len(ret)-5).std() if len(ret) > 10 else recent_vol
          result = recent_vol / historical_vol if historical_vol > 0 else 1.0
    direction: -1
    description: "Volatility regime indicator"

processing:
  min_data_points: 20
  winsorization_stds: 2
  entropy_calculation:
    bins: 8
    min_symbols: 2